# Starts the whole OpsDesk system with one command:
#
#   docker compose up --build
#
# Then open http://localhost:3000. Settings come from the .env file next to
# this one (copy .env.example to .env first). The three repositories must sit
# side by side, because the backend and frontend are built from ../ folders.

name: opsdesk

services:

  # PostgreSQL. Not published to the computer: only the backend talks to it,
  # over the network Compose creates, where its address is simply "db".
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: opsdesk
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # The database files live in a named volume, outside the container, so
      # the data survives "docker compose down" and rebuilding the images.
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      # Healthy once PostgreSQL accepts connections. $$ passes a single $ to
      # the container, so it reads its own POSTGRES_USER.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d opsdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The Spring Boot API, built from ../opsdesk-backend with the prod profile.
  backend:
    build: ../opsdesk-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # "db" is the database service's name on the Compose network.
      DB_URL: jdbc:postgresql://db:5432/opsdesk
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # The address the browser shows for the frontend, including the port.
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:3000}
    depends_on:
      # Wait until PostgreSQL accepts connections, not just until it starts.
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  # The React app, built from ../opsdesk-frontend and served by nginx.
  frontend:
    build:
      context: ../opsdesk-frontend
      args:
        # Read by the browser, so it is the backend's address as seen from
        # this computer, not "backend". Built in: change it, then rebuild.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  dbdata:
